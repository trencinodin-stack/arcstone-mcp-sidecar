[package]
name = "arcstone-execution-boundary"
version = "0.1.0"
edition = "2021"
publish = false
description = "Experimental downstream execution-boundary realization for Arcstone."
repository = "https://github.com/trencinodin-stack/arcstone-mcp-sidecar"
license = "Apache-2.0"

[[bin]]
name = "arcstone-exec"
path = "src/bin/arcstone-exec.rs"

[dependencies]
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
